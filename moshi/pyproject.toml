[project]
name = "moshi-personaplex"
requires-python = ">= 3.10"
description = "Personaplex finetune of moshi to enable role and voice control."
dependencies = [
    "numpy >= 1.26, < 2.2",
    "safetensors >= 0.4.0, < 0.5",
    "huggingface-hub >= 0.24, < 0.25",
    "einops == 0.7",
    "sentencepiece == 0.2",
    "sounddevice == 0.5",
    "sphn >= 0.2.0, < 0.3",
    "torch >= 2.2.0, < 2.5",
    "aiohttp>=3.10.5, <3.11",
    "tqdm >= 4.66, < 5",
]
authors = [{name="Rajarshi Roy", email="rajarshir@nvidia.com"}]
maintainers = [{name="Rajarshi Roy", email="rajarshir@nvidia.com"}]
license = {text = "MIT"}
dynamic = ["version"]
readme = "README.md"

[project.scripts]
moshi-server = "moshi.server:main"
moshi-offline = "moshi.offline:main"
moshi-convert-mlx = "moshi.convert_mlx:main"

[project.optional-dependencies]
mlx = [
    "mlx >= 0.26, < 0.27; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "moshi_mlx == 0.3.0; platform_system == 'Darwin' and platform_machine == 'arm64'",
    "rustymimi == 0.4.1; platform_system == 'Darwin' and platform_machine == 'arm64'",
]

[tool.setuptools.dynamic]
version = {attr = "moshi.__version__"}

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
